submission:
  title: "RouteGuard AI - Supply Chain Disruption & Fleet Utilisation Optimizer"
  problem_statement: >
    Supply-chain disruptions such as severe weather, port strikes, and
    geopolitical events can cascade across shipments, while fleet assets
    may remain idle as other routes become overloaded. Cold-chain shipments
    are especially vulnerable because temperature excursions can cause
    product loss and delivery risk.
  solution_summary: >
    RouteGuard AI is a decision-support application that identifies
    disruption-affected shipments, prioritizes shipment risk, recommends
    safer alternative routes, identifies underutilized fleet assets for
    redeployment, and monitors cold-chain temperature excursions. It also
    provides an IBM watsonx.ai powered Copilot for natural-language
    operational recommendations.
  key_features:
    - "Disruption-aware shipment risk prioritization"
    - "Disruption-aware route optimization"
    - "Fleet utilization analysis and redeployment recommendations"
    - "Cold-chain temperature excursion monitoring and severity classification"
    - "IBM watsonx.ai powered AI Copilot"
  tech_stack:
    languages:
      - "Python"
    frameworks:
      - "Streamlit"
      - "Pandas"
      - "NumPy"
      - "Plotly"
    ibm_technologies:
      - "IBM watsonx.ai"
      - "IBM Bob IDE"
    databases: []
    other:
      - "NetworkX/custom optimization scoring"
      - "Pytest"
      - "Synthetic CSV datasets"
  what_we_are_most_proud_of: >
    We are most proud of building an end-to-end supply-chain decision
    support prototype that combines disruption risk, route optimization,
    fleet utilization, cold-chain monitoring, and an IBM watsonx.ai Copilot
    in a single interactive Streamlit dashboard.
  known_limitations: >
    The prototype uses synthetic CSV datasets and rule-based optimization
    and risk scoring rather than live logistics feeds. Cold-chain severity
    classification is a prototype implementation and should be validated
    against operational sensor and domain thresholds before production use.
    
